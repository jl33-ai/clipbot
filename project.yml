name: Clipbot
options:
  bundleIdPrefix: io.linus
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: 8L83KP4DT8
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development" # the certificate for DEVELOPMENT_TEAM
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ClipbotCore:
    type: framework
    platform: macOS
    sources: [Sources/ClipbotCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.linus.clipbot.core
        GENERATE_INFOPLIST_FILE: YES
  Clipbot:
    type: application
    platform: macOS
    sources: [Sources/Clipbot]
    dependencies:
      - target: ClipbotCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.linus.clipbot
        PRODUCT_NAME: Dclip
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Clipbot.entitlements
      configs:
        Debug:
          # Separate identity: a Debug build (debuggable, extra sandbox exceptions) gets its own
          # container and Keychain items and can never open the real app's data.
          PRODUCT_BUNDLE_IDENTIFIER: io.linus.clipbot.debug
          PRODUCT_NAME: Dclip Debug
        Release:
          # No get-task-allow: nothing may attach a debugger and read decrypted clips from memory.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  ClipbotCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/ClipbotCoreTests]
    dependencies:
      - target: ClipbotCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.linus.clipbot.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Clipbot:
    build:
      targets:
        Clipbot: all
    test:
      targets: [ClipbotCoreTests]
